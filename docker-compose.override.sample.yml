# Merge into AntiZapret v6 docker-compose.override.yml; see docs/antizapret.md.
# Add AWG_SYNC_USER / AWG_SYNC_PASS to AZ's existing .env.
services:
  awg-sync:
    image: ghcr.io/razgame/keeneticazsync:latest
    hostname: awg-sync.antizapret
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      BASIC_AUTH_USER: ${AWG_SYNC_USER:-admin}
      BASIC_AUTH_PASS: ${AWG_SYNC_PASS:?Set AWG_SYNC_PASS in .env}
    volumes:
      - awg-sync-config:/app/config
    # No public HTTP port. AZ Caddy connects over the shared default network.

  https:
    ports:
      - "8787:8787"
    environment:
      # Keep PROXY_SERVICE_1..8 from AZ. If 9 is occupied, use the next free
      # consecutive number: Caddy stops reading at the first missing number.
      PROXY_SERVICE_9: AWG Sync:8787:awg-sync.antizapret:8787

volumes:
  awg-sync-config:
